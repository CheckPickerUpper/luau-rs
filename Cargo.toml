[package]
name = "roblox-rust"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust-to-Luau compiler/toolchain for Roblox"
license = "MIT"
repository = "https://github.com/CheckPickerUpper/luau-rs"

[dependencies]

[dev-dependencies]
full_moon = { version = "=2.2.0", features = ["luau"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
# The lexer keeps its ordered token grammar in one dispatch.
too_many_lines = { level = "allow", priority = 1 }
# Explicit Result matches keep every compiler rejection branch visible for review.
question_mark = { level = "allow", priority = 1 }
# Constant-false assertions are the test failure path permitted by the project's no-panic rule.
assertions_on_constants = { level = "allow", priority = 1 }
