[package]
name = "luau-rs"
version = "0.1.0"
edition = "2021"
description = "Experimental Rust-to-Luau compiler/toolchain for Roblox"
license = "MIT"
repository = "https://github.com/CheckPickerUpper/luau-rs"

[dependencies]
atomic-write-file = "0.3.1"
clap = { version = "4.6.6", features = ["derive"] }
fs-err = "3.3.1"
serde = { version = "1.0.229", features = ["derive"] }
thiserror = "2.0.20"
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
walkdir = "2.5.0"
walrus = "0.26.5"

[dev-dependencies]
assert_cmd = "2.2.2"
insta = "1.48.0"
predicates = "3.1.4"
rstest = "0.26.1"
tempfile = "3.27.0"
wast = { version = "258.0.0", default-features = false, features = ["wasm-module"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
all = "deny"
pedantic = "deny"
nursery = "deny"
unwrap_used = "deny"
expect_used = "deny"
# The lexer keeps its ordered token grammar in one dispatch.
too_many_lines = { level = "allow", priority = 1 }
# Explicit Result matches keep every compiler rejection branch visible for review.
question_mark = { level = "allow", priority = 1 }
# Constant-false assertions are the test failure path permitted by the project's no-panic rule.
assertions_on_constants = { level = "allow", priority = 1 }
